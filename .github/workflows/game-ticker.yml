# Game-day ticker: calls /api/tick about once a minute while NFL games are on, so phones get
# alerts for scores, lead changes, finals and league news. When no game is on or about to start,
# it calls once (to catch league news) and stops. Free on a public repo.
name: Game-day ticker

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: ticker
  cancel-in-progress: false   # a run that starts while another is going waits, then picks up where it left off

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TICK_URL: https://leagueofordinarygentlemen.vercel.app/api/tick
    steps:
      - name: Tick while games are on (up to 55 minutes)
        run: |
          end=$(( $(date +%s) + 55*60 )); quiet=0
          while [ "$(date +%s)" -lt "$end" ]; do
            out=$(curl -s -m 25 -X POST "$TICK_URL" || echo '{}')
            echo "$(date -u +%H:%M:%S) $out"
            active=$(echo "$out" | python3 -c 'import sys,json
          try: print(str(json.load(sys.stdin).get("active", False)).lower())
          except Exception: print("false")')
            if [ "$active" = "true" ]; then quiet=0; else quiet=$((quiet+1)); fi
            [ "$quiet" -ge 2 ] && break
            sleep 55
          done
