# Every morning: pull the league from Sleeper plus FantasyCalc and Dynasty Daddy values,
# rebuild the site, and commit if anything changed. Vercel redeploys on every commit.
name: Daily data refresh

on:
  schedule:
    - cron: "17 11 * * *"   # 11:17 UTC = 5:17 AM Central (6:17 during daylight time)
  workflow_dispatch: {}      # "Run workflow" button on GitHub for an on-demand refresh

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull fresh league data
        id: fetch
        run: |
          set +e
          python3 scripts/refresh.py fetch --old public/data/league-data.json --out fresh.json
          code=$?
          set -e
          if [ "$code" = "3" ]; then
            echo "Sleeper unreachable; keeping yesterday's data."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" != "0" ]; then
            exit "$code"
          else
            mv fresh.json public/data/league-data.json
          fi

      - name: Rebuild the page
        if: steps.fetch.outputs.skip != 'true'
        run: python3 scripts/build_site.py

      - name: Commit if anything changed
        if: steps.fetch.outputs.skip != 'true'
        run: |
          if git diff --quiet; then echo "No changes."; exit 0; fi
          git config user.name "ogsn-bot"
          git config user.email "ogsn-bot@users.noreply.github.com"
          git add public/data/league-data.json public/index.html
          git commit -m "Daily data refresh $(date -u +%Y-%m-%d)"
          git push
