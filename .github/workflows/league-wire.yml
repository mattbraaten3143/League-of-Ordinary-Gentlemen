# Every 2 hours: league moves and injury designations for rostered players (scripts/league_wire.py).
# Commits only when something changed. Vercel redeploys on every commit.
name: League Wire

on:
  schedule:
    - cron: "37 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh            # never runs at the same time as the daily refresh
  cancel-in-progress: false

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update the League Wire
        id: wire
        run: |
          set +e
          python3 scripts/league_wire.py public/data/league-data.json
          code=$?
          set -e
          if [ "$code" = "3" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; elif [ "$code" != "0" ]; then exit "$code"; fi
      - name: Rebuild and commit if anything changed
        if: steps.wire.outputs.skip != 'true'
        run: |
          python3 scripts/build_site.py
          git config user.name "ogsn-bot"
          git config user.email "ogsn-bot@users.noreply.github.com"
          git add public/data/league-data.json public/index.html
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "League Wire $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || (git pull --rebase origin main && git push)
